name: Apply Issue 53 front-end payload

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/apply-issue53-front-end.yml"
      - "tools/apply_issue53_front_end.py"
      - "tools/issue53_manifest.json"
      - "tools/issue53_payload/**"

permissions:
  contents: write

concurrency:
  group: apply-issue53-front-end-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/issue53-front-end-save-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue53-front-end-save-ux
          fetch-depth: 0
      - name: Apply exact front-end payload
        run: python tools/apply_issue53_front_end.py
      - name: Commit exact front-end sources
        run: |
          set -euo pipefail
          git config user.name "AbyssFall Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add front end build selection and visible save flow"
          git push origin HEAD:feature/issue53-front-end-save-ux
