name: Apply Issue 53 compile fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/apply-issue53-compile-fix.yml"
      - "tools/apply_issue53_compile_fix.py"

permissions:
  contents: write

concurrency:
  group: apply-issue53-compile-fix-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/issue53-front-end-save-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue53-front-end-save-ux
          fetch-depth: 0
      - name: Apply compile-context correction
        run: python tools/apply_issue53_compile_fix.py
      - name: Commit corrected front-end source
        run: |
          set -euo pipefail
          git config user.name "AbyssFall Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve persistence service through scene tree"
          git push origin HEAD:feature/issue53-front-end-save-ux
