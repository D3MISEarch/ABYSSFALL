name: Apply Issue 52 controller focus correction

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/apply-issue52-focus.yml"
      - "tools/apply_issue52_focus.py"

permissions:
  contents: write

concurrency:
  group: apply-issue52-focus-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/issue52-player-controlled-inventory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue52-player-controlled-inventory
          fetch-depth: 0
      - name: Apply exact focus correction
        run: python tools/apply_issue52_focus.py
      - name: Commit corrected inventory focus
        run: |
          set -euo pipefail
          git config user.name "AbyssFall Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve controller focus through inventory refresh"
          git push origin HEAD:feature/issue52-player-controlled-inventory
