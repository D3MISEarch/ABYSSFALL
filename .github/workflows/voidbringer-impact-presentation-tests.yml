name: Voidbringer Impact Presentation Tests

on:
  pull_request:
    paths:
      - "scripts/boot.gd"
      - "scenes/voidbringer_impact_showcase_sandbox.tscn"
      - "scripts/impact_feedback.gd"
      - "scripts/skeleton.gd"
      - "scripts/bone_archer.gd"
      - "scripts/crypt_brute.gd"
      - "scripts/hollow_king.gd"
      - "scripts/void_bolt.gd"
      - "scripts/characters/voidbringer/voidbringer_sandbox_target.gd"
      - "scripts/presentation/**"
      - "tests/test_voidbringer_impact_feedback.gd"
      - "tests/test_voidbringer_single_owner_fracture.gd"
      - "tests/test_voidbringer_presentation_modes_haptics.gd"
      - "tests/test_voidbringer_immutable_impact_presenter.gd"
      - "tests/test_voidbringer_impact_showcase_sandbox.gd"
      - "tests/test_voidbringer_showcase_owner_controls.gd"
      - "tests/test_voidbringer_environment_reaction.gd"
      - "tests/test_voidbringer_impact_audio.gd"
      - ".github/workflows/voidbringer-impact-presentation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidbringer-impact-presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-owner-fracture:
    name: Godot 4.4.1 Single-Owner Fracture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee voidbringer-impact-import.log
          if grep -Eiq 'SCRIPT ERROR|PARSER ERROR|Parse Error|Compile Error|Failed to load script|Invalid call|ERROR:' voidbringer-impact-import.log; then
            echo "Voidbringer impact presentation import failed."
            exit 1
          fi

      - name: Run inherited impact and payoff regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_voidbringer_impact_feedback.gd 2>&1 | tee voidbringer-impact-feedback.log
          if grep -Eiq 'SCRIPT ERROR|PARSER ERROR|Parse Error|Compile Error|Failed to load script|Invalid call|ASSERTION FAILED|^FAIL:|ERROR:' voidbringer-impact-feedback.log; then
            echo "Inherited Voidbringer impact regression failed."
            exit 1
          fi
          grep -Fxq 'PASS: Voidbringer impact and Corruption payoff' voidbringer-impact-feedback.log

      - name: Run single-owner Fracture proof
        shell: bash
        run: |
          set -euo pipefail
          godot --verbose --headless --path . --script res://tests/test_voidbringer_single_owner_fracture.gd 2>&1 | tee voidbringer-single-owner-fracture.log
          if grep -Eiq 'SCRIPT ERROR|PARSER ERROR|Parse Error|Compile Error|Failed to load script|Invalid call|ASSERTION FAILED|^FAIL:|ERROR:' voidbringer-single-owner-fracture.log; then
            echo "Voidbringer single-owner Fracture regression failed."
            exit 1
          fi
          grep -Fxq 'PASS: Voidbringer combat physics and showcase feedback' voidbringer-single-owner-fracture.log

      - name: Run presentation modes and real haptics proof
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_voidbringer_presentation_modes_haptics.gd 2>&1 | tee voidbringer-presentation-modes-haptics.log
          if grep -Eiq 'SCRIPT ERROR|PARSER ERROR|Parse Error|Compile Error|Failed to load script|Invalid call|ASSERTION FAILED|^FAIL:|ERROR:' voidbringer-presentation-modes-haptics.log; then
            echo "Voidbringer presentation mode or haptics regression failed."
            exit 1
          fi
          grep -Fxq 'PASS: Voidbringer presentation modes and real haptics' voidbringer-presentation-modes-haptics.log

      - name: Run immutable impact presenter proof
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_voidbringer_immutable_impact_presenter.gd 2>&1 | tee voidbringer-immutable-impact-presenter.log
          if grep -Eiq 'SCRIPT ERROR|PARSER ERROR|Parse Error|Compile Error|Failed to load script|Invalid call|ASSERTION FAILED|^FAIL:|ERROR:' voidbringer-immutable-impact-presenter.log; then
            echo "Voidbringer immutable impact presenter regression failed."
            exit 1
          fi
          grep -Fxq 'PASS: Voidbringer immutable impact presentation' voidbringer-immutable-impact-presenter.log

      - name: Run playable impact showcase proof
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_voidbringer_impact_showcase_sandbox.gd 2>&1 | tee voidbringer-impact-showcase-sandbox.log
          if grep -Eiq 'SCRIPT ERROR|PARSER ERROR|Parse Error|Compile Error|Failed to load script|Invalid call|ASSERTION FAILED|^FAIL:|ERROR:' voidbringer-impact-showcase-sandbox.log; then
            echo "Voidbringer impact showcase regression failed."
            exit 1
          fi
          grep -Fxq 'PASS: Voidbringer savage impact showcase sandbox' voidbringer-impact-showcase-sandbox.log

      - name: Run owner controls and visibility proof
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --audio-driver Dummy --path . --script res://tests/test_voidbringer_showcase_owner_controls.gd 2>&1 | tee voidbringer-showcase-owner-controls.log
          if grep -Eiq 'SCRIPT ERROR|PARSER ERROR|Parse Error|Compile Error|Failed to load script|Invalid call|ASSERTION FAILED|^FAIL:|ERROR:' voidbringer-showcase-owner-controls.log; then
            echo "Voidbringer showcase owner controls or visibility regression failed."
            exit 1
          fi
          grep -Fxq 'PASS: Voidbringer showcase owner controls and visibility' voidbringer-showcase-owner-controls.log

      - name: Run bounded environment reaction proof
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_voidbringer_environment_reaction.gd 2>&1 | tee voidbringer-environment-reaction.log
          if grep -Eiq 'SCRIPT ERROR|PARSER ERROR|Parse Error|Compile Error|Failed to load script|Invalid call|ASSERTION FAILED|^FAIL:|ERROR:' voidbringer-environment-reaction.log; then
            echo "Voidbringer bounded environment reaction regression failed."
            exit 1
          fi
          grep -Fxq 'PASS: Voidbringer bounded environment reaction' voidbringer-environment-reaction.log

      - name: Run deterministic impact audio proof
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --audio-driver Dummy --path . --script res://tests/test_voidbringer_impact_audio.gd 2>&1 | tee voidbringer-impact-audio.log
          if grep -Eiq 'SCRIPT ERROR|PARSER ERROR|Parse Error|Compile Error|Failed to load script|Invalid call|ASSERTION FAILED|^FAIL:|ERROR:' voidbringer-impact-audio.log; then
            echo "Voidbringer deterministic impact audio regression failed."
            exit 1
          fi
          grep -Fxq 'PASS: Voidbringer deterministic impact audio' voidbringer-impact-audio.log

      - name: Verify isolated showcase boot route
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 10s godot --headless --path . -- --sandbox=voidbringer_showcase > voidbringer-impact-showcase-route.log 2>&1
          status=$?
          set -e
          cat voidbringer-impact-showcase-route.log
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            exit "$status"
          fi
          if grep -Eiq 'SCRIPT ERROR|PARSER ERROR|Parse Error|Compile Error|Failed to load script|Invalid call|ERROR:' voidbringer-impact-showcase-route.log; then
            exit 1
          fi
          grep -Fq 'ABYSSFALL_SANDBOX_LAUNCHED:voidbringer_showcase' voidbringer-impact-showcase-route.log
          if grep -Fq 'ABYSSFALL_CLASS_LAUNCHED:' voidbringer-impact-showcase-route.log; then
            echo "Showcase boot route launched campaign gameplay."
            exit 1
          fi

      - name: Upload focused logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voidbringer-impact-presentation-logs
          path: |
            voidbringer-impact-import.log
            voidbringer-impact-feedback.log
            voidbringer-single-owner-fracture.log
            voidbringer-presentation-modes-haptics.log
            voidbringer-immutable-impact-presenter.log
            voidbringer-impact-showcase-sandbox.log
            voidbringer-showcase-owner-controls.log
            voidbringer-environment-reaction.log
            voidbringer-impact-audio.log
            voidbringer-impact-showcase-route.log
          if-no-files-found: warn
          retention-days: 14
