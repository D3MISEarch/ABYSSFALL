name: Apply Issue 52 inventory payload

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/apply-issue52-inventory.yml"
      - "tools/apply_issue52_inventory.py"
      - "tools/issue52_payload/**"

permissions:
  contents: write

concurrency:
  group: apply-issue52-inventory-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/issue52-player-controlled-inventory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue52-player-controlled-inventory
          fetch-depth: 0
      - name: Apply exact payload
        run: python tools/apply_issue52_inventory.py
      - name: Commit exact inventory sources
        run: |
          set -euo pipefail
          git config user.name "AbyssFall Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: make playable inventory player-controlled and durable"
          git push origin HEAD:feature/issue52-player-controlled-inventory
