name: Apply Issue 59 complete-route art pass

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/apply-issue59-route-art.yml"

permissions:
  contents: write

concurrency:
  group: apply-issue59-route-art-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/issue59-art-pass0-sunken-crypts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue59-art-pass0-sunken-crypts
          fetch-depth: 0
      - name: Apply complete-route art payload
        run: python tools/apply_issue59_route_art.py
      - name: Commit permanent Art Pass 0 route expansion
        run: |
          set -euo pipefail
          git config user.name "AbyssFall Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/art/sunken_crypts_art_pass0.gd tests/test_art_pass0_visual_contract.gd Docs/Roadmap tools/apply_issue59_route_art.py tools/issue59_route_art_payload
          git commit -m "feat: dress the complete Sunken Crypts route"
          git push origin HEAD:feature/issue59-art-pass0-sunken-crypts
