name: Apply live projection payload

on:
  push:
    branches:
      - feature/issue46b-graphical-class-tree
    paths:
      - ".github/workflows/apply-live-projection.yml"
      - "tools/apply_live_projection.py"
      - "tools/live_projection_payload/**"

permissions:
  contents: write

concurrency:
  group: apply-live-projection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue46b-graphical-class-tree
          fetch-depth: 0
      - name: Apply exact payload
        run: python tools/apply_live_projection.py
      - name: Commit exact projected sources
        run: |
          set -euo pipefail
          git config user.name "AbyssFall Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: project class-tree stats into live combat"
          git push origin HEAD:feature/issue46b-graphical-class-tree
