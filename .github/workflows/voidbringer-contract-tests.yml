name: Voidbringer Contract Tests

on:
  pull_request:
    paths:
      - "scripts/characters/voidbringer/**"
      - "scripts/core/playable_combat_projection.gd"
      - "tests/test_voidbringer_foundation_contracts.gd"
      - ".github/workflows/voidbringer-contract-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/characters/voidbringer/**"
      - "scripts/core/playable_combat_projection.gd"
      - "tests/test_voidbringer_foundation_contracts.gd"
      - ".github/workflows/voidbringer-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidbringer-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  command-and-damage-contracts:
    name: Godot 4.4.1 Voidbringer Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Run command catalog and damage foundation
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_voidbringer_foundation_contracts.gd 2>&1 | tee voidbringer-foundation-contracts.log
          if grep -Eiq 'SCRIPT ERROR|PARSER ERROR|Parse Error|ASSERTION FAILED|^FAIL:' voidbringer-foundation-contracts.log; then
            echo "Voidbringer command and damage foundation regression failed."
            exit 1
          fi
          if ! grep -Fxq 'PASS: Voidbringer command and damage foundation' voidbringer-foundation-contracts.log; then
            echo "Missing Voidbringer command and damage foundation PASS marker."
            exit 1
          fi

      - name: Upload focused log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voidbringer-contract-logs
          path: voidbringer-foundation-contracts.log
          if-no-files-found: warn
          retention-days: 7
