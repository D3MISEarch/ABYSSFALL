name: Apply Issue 59 Art Pass 0 integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/apply-issue59-art-pass0.yml"
      - "tools/apply_issue59_art_pass0.py"

permissions:
  contents: write

concurrency:
  group: apply-issue59-art-pass0-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/issue59-art-pass0-sunken-crypts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue59-art-pass0-sunken-crypts
          fetch-depth: 0
      - name: Apply guarded gameplay-scene integration
        run: python tools/apply_issue59_art_pass0.py
      - name: Commit permanent Art Pass 0 scene integration
        run: |
          set -euo pipefail
          git config user.name "AbyssFall Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/main.gd tools/apply_issue59_art_pass0.py
          git commit -m "art: install Sunken Crypts courtyard presentation layer"
          git push origin HEAD:feature/issue59-art-pass0-sunken-crypts
